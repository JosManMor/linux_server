<VirtualHost *:80>
    ServerName mi_sitio.local
    ServerAlias www.mi_sitio.local
    DocumentRoot /var/www/mi_sitio/public

    # Logs propios del sitio
    ErrorLog  ${APACHE_LOG_DIR}/mi_sitio_error.log
    CustomLog ${APACHE_LOG_DIR}/mi_sitio_access.log combined

    <Directory /var/www/mi_sitio/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquear acceso a includes/ desde navegador
    <Directory /var/www/mi_sitio/includes>
        Require all denied
    </Directory>

    # Cabeceras de seguridad
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>
